data:
  _target_: data.base_data_module.BaseDataModule
  opt:
    data_dir: null
    train:
      dataset:
        _target_: data.cleanunet_dataset.CleanNoisyPairDataset
        root: datasets/debug
        subset: training
        crop_length_sec: 0
      dataloader:
        batch_size: 2
        num_workers: 2
        shuffle: true
        pin_memory: true
    val:
      dataset:
        _target_: data.cleanunet_dataset.CleanNoisyPairDataset
        root: datasets/debug
        subset: training
        crop_length_sec: 0
      dataloader:
        batch_size: 2
        num_workers: 2
model:
  _target_: models.intersubnet_model.InterSubNetModel
  net:
    _target_: archs.InterSubNet.InterSubNet
    sb_num_neighbors: 15
    num_freqs: 257
    look_ahead: 2
    sequence_model: LSTM
    sb_output_activate_function: false
    sb_model_hidden_size: 384
    weight_init: false
    norm_type: offline_laplace_norm
    num_groups_in_drop_band: 2
    sbinter_middle_hidden_times: 0.8
training:
  acoustics:
    n_fft: 512
    win_length: 512
    sr: 16000
    hop_length: 256
  train:
    optim:
      _target_: torch.optim.Adam
      lr: 0.001
    losses:
      l1:
        _target_: torch.nn.MSELoss
        reduction: mean
  val:
    metrics:
      pesq_wb:
        _target_: torchmetrics.audio.pesq.PerceptualEvaluationSpeechQuality
        fs: 16000
        mode: wb
      pesq_nb:
        _target_: torchmetrics.audio.pesq.PerceptualEvaluationSpeechQuality
        fs: 16000
        mode: nb
      stoi:
        _target_: torchmetrics.audio.stoi.ShortTimeObjectiveIntelligibility
        fs: 16000
trainer:
  manual_seed: 0
  checkpoint_path: null
  trainer_args:
    max_steps: 250000
    accelerator: auto
  callbacks:
    ModelCheckpoint:
      _target_: pytorch_lightning.callbacks.ModelCheckpoint
      every_n_epochs: 4
    LearningRateMonitor:
      _target_: pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: step
name: CleanUNet
logger:
  use_tb_logger: null
  wandb:
    project: null
    resume_id: null
    group: null
