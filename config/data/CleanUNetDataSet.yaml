_target_: data.base_data_module.BaseDataModule

opt:
  data_dir:
  train:
    dataset:
      _target_: data.cleanunet_dataset.CleanNoisyPairDataset
      root: /kaggle/input/dns-2020-100hrs/training_set
      subset: training
      crop_length_sec: 0


    dataloader:
      batch_size: 2
      num_workers: 2
      shuffle: True
      pin_memory: True

  val:
    dataset:
      _target_: data.cleanunet_dataset.CleanNoisyPairDataset
      root: /kaggle/input/deep-noise-suppression-challenge-interspeech-2020/datasets
      subset: testing
      crop_length_sec: 0
  
    dataloader:
      batch_size: 2
      num_workers: 2
      # shuffle: True
      # pin_memory: True
