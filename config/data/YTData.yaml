_target_: data.base_data_module.BaseDataModule

opt:
  data_dir:
  train:
    dataset:
      _target_: data.yt_data.YTData
      data_manifest: "scripts/yt_data/train_data_manifest.json"
      data_root: ""
      output_mapper:
        _target_: data.yt_data.TupleTransform
      length_sec: 3
      pitch_shifts: [-2, -1, 0, 1, 2]

    dataloader:
      batch_size: 2
      num_workers: 4
      shuffle: True
      pin_memory: True
      # collate_fn:
      #   _target_: data.yt_data.YTCollate

  val:
    dataset:
      _target_: data.yt_data.YTData
      data_manifest: "scripts/yt_data/val_data_manifest.json"
      data_root: ""
      output_mapper:
        _target_: data.yt_data.TupleTransform
      length_sec: 10
      snrs_db: [3]
  
    dataloader:
      batch_size: 1
      num_workers: 4
      # collate_fn:
      #   _target_: data.yt_data.YTCollate
      # shuffle: True
      # pin_memory: True