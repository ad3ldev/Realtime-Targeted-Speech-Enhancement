_target_: data.base_data_module.BaseDataModule

opt:
  data_dir:
  train:
    dataset:
      _target_: data.yt_data.YTData
      data_manifest: "scripts/yt_data/data_manifest.json"
      data_root: ""
      crop_length_sec: 3

    dataloader:
      batch_size: 2
      num_workers: 2
      shuffle: True
      pin_memory: True
      collate_fn:
        _target_: data.yt_data.YTCollate

  val:
    dataset:
      _target_: data.yt_data.YTData
      data_manifest: "scripts/yt_data/data_manifest.json"
      data_root: ""
      crop_length_sec: 3
      take: 1000
  
    dataloader:
      batch_size: 1
      num_workers: 2
      collate_fn:
        _target_: data.yt_data.YTCollate
      # shuffle: True
      # pin_memory: True