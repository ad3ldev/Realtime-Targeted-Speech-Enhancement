_target_: data.base_data_module.BaseDataModule

opt:
  data_dir:
  train:
    dataset:
      _target_: data.pdns_dataset.PDNSDataset
      split: train
      clean_paths: 
        - /kaggle/input/pdns-2023-100-hours-1/clean
        - /kaggle/input/pdns-2023-100-hours-2/clean
        - /kaggle/input/pdns-2023-100-hours-3/clean
      noisy_paths: 
        - /kaggle/input/pdns-2023-100-hours-1/noisy
        - /kaggle/input/pdns-2023-100-hours-2/noisy
        - /kaggle/input/pdns-2023-100-hours-3/noisy
      synthesized_speakers_paths: 
        - /kaggle/input/pdns-2023-100-hours-1/logs/synthesized_sources.csv
        - /kaggle/input/pdns-2023-100-hours-2/logs/synthesized_sources.csv
        - /kaggle/input/pdns-2023-100-hours-3/logs/synthesized_sources.csv
      dataset_speakers_paths: 
        - /kaggle/input/dns-2023-speakers-annotations/english_read_speech.csv
      sr: 44100
      mode: all
      seed: 42
      reference_tensor: False
      crop_length_sec: 3

    dataloader:
      batch_size: 20
      num_workers: 4
      shuffle: True # Can be changed to False if we wanted identical experiments
      pin_memory: True
      collate_fn:
        _target_: data.pdns_dataset.PDNSCollate

  val:
    dataset:
      _target_: data.pdns_dataset.PDNSDataset
      split: val
      clean_paths: 
        - /kaggle/input/dns-2023-dev-testset-speaker/clean_personalized
      noisy_paths: 
        - /kaggle/input/dns-2023-dev-testset-speaker/noisy
      speaker_reference_paths: 
        - /kaggle/input/dns-2023-dev-testset-speaker/speaker_reference_16000
      sr: 44100

    dataloader:
      batch_size: 1
      num_workers: 4
      collate_fn:
        _target_: data.pdns_dataset.PDNSCollate # shuffle: True
      # pin_memory: True
  
  test:
    dataset:
      _target_: data.pdns_dataset.PDNSDataset
      split: test
      clean_paths: 
      noisy_paths: 
        - /kaggle/input/dns-2023-blind-testset-data/V5_BlindTestSet_mono/Track2_Speakerphone/noisy
      speaker_reference_paths: 
        - /kaggle/input/dns-2023-blind-testset-data/V5_BlindTestSet_mono/Track2_Speakerphone/enrol
      sr: 16000
      mode: all
      seed: 42
      reference_tensor: False
      crop_length_sec: 0

    dataloader:
      batch_size: 1
      num_workers: 4
      collate_fn:
        _target_: data.pdns_dataset.PDNSCollate # shuffle: True
      # pin_memory: True
