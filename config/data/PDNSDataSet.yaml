_target_: data.base_data_module.BaseDataModule

opt:
  data_dir:
  train:
    dataset:
      _target_: data.pdns_dataset.PDNSDataset
      split: train
      clean_path: /kaggle/input/pdns-2023-10-hours/clean
      noisy_path: /kaggle/input/pdns-2023-10-hours/noisy
      synthesized_speakers_csv: /kaggle/input/pdns-2023-10-hours/logs/synthesized_sources.csv
      reference_speakers_csv: /kaggle/input/dns-2023-speakers-annotations/english_read_speech.csv
      sr: 44100
      mode: all
      seed: 42
      reference_tensor: False
      crop_length_sec: 3

    dataloader:
      batch_size: 8
      num_workers: 4
      shuffle: True # Can be changed to False if we wanted identical experiments
      pin_memory: True
      collate_fn:
        _target_: data.pdns_dataset.PDNSCollate

  val:
    dataset:
      _target_: data.pdns_dataset.PDNSDataset
      split: val
      clean_path: /kaggle/input/dns-2023-dev-testset-speaker/clean_personalized
      noisy_path: /kaggle/input/dns-2023-dev-testset-speaker/noisy
      speaker_reference_path: /kaggle/input/dns-2023-dev-testset-speaker/speaker_reference_16000
      sr: 44100

    dataloader:
      batch_size: 8
      num_workers: 4
      collate_fn:
        _target_: data.pdns_dataset.PDNSCollate # shuffle: True
      # pin_memory: True
