manual_seed: 0

checkpoint_path: 

trainer_args: 
  max_steps: 250000
  accelerator: auto

callbacks:
  ModelCheckpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    every_n_epochs: 20

  
  LearningRateMonitor:
    _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: epoch