manual_seed: 0

checkpoint_path: 

trainer_args: 
  max_epochs: 500
  overfit_batches: 1

callbacks:
  ModelCheckpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    every_n_epochs: 100
    save_top_k: -1
  
  LearningRateMonitor:
    _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: epoch