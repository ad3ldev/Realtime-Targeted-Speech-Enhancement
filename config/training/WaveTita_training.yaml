train:
  optim:
    _target_: torch.optim.Adam
    lr: 5e-3
    weight_decay: 0.0

  scheduler:
    _target_: utils.schedulers.LinearWarmupCosineDecay
    lr_max: 5e-3
    n_iter: 250000
    iteration: 10001
    divider: 25
    warmup_proportion: 0.05
    phase: ['linear', 'cosine']

  losses:
    l1:
      _target_: torch.nn.L1Loss
      reduction: mean
      
    mrstft:
      _target_: loss.stft_loss.MultiResolutionSTFTLoss
      sc_lambda: 0.5
      mag_lambda: 0.5
      band: full
      hop_sizes: [50, 120, 240]
      win_lengths: [240, 600, 1200]
      fft_sizes: [512, 1024, 2048]

  losses_weights:
    mrstft: 0.5
      
val:
  metrics:    
    DNSMOS:
      _target_: metrics.dnsmos_local.DNSMOSScore
      fs: 44100
      personalized_MOS: True
    
    l1:
      _target_: torch.nn.L1Loss
      reduction: mean
