train:  
  optim:
    _target_: torch.optim.Adam
    lr: 3e-4
    betas: [0.9, 0.999]
    

  scheduler:
    _target_: utils.schedulers.LinearWarmupCosineDecay
    lr_max: 1e-4
    n_iter: 250000
    iteration: 10001
    divider: 25
    warmup_proportion: 0.05
    phase: ['linear', 'cosine']

  losses:
    l1:
      _target_: torch.nn.L1Loss
      reduction: mean
      
    stft:
      _target_: loss.cleanunet_loss.CleanUNetSTFTLoss
      stft_lambda: 1
      mrstftloss:
        _target_: loss.stft_loss.MultiResolutionSTFTLoss
        sc_lambda: 0.5
        mag_lambda: 0.5
        band: full
        hop_sizes: [50, 120, 240]
        win_lengths: [240, 600, 1200]
        fft_sizes: [512, 1024, 2048]


val:
  metrics:
    pesq_wb:
      _target_: torchmetrics.audio.pesq.PerceptualEvaluationSpeechQuality
      fs: 16000
      mode: wb

    pesq_nb:
      _target_: torchmetrics.audio.pesq.PerceptualEvaluationSpeechQuality
      fs: 16000
      mode: nb
      
    stoi:
      _target_: torchmetrics.audio.stoi.ShortTimeObjectiveIntelligibility
      fs: 16000