_target_: models.base_model.BaseModel

net:
  _target_: archs.WaveTita.WaveTita
  initial_weights: /kaggle/working/Realtime-Targeted-Speech-Enhancement/rttse/archs/Denoiser_init_ckpt.th
  strict: false
  speech_enhancer:
    _target_: archs.PDenoiser.PDenoiser
    reference_embedding: 192
    chin: 1
    chout: 1
    hidden: 48
    max_hidden: 10000
    causal: true
    glu: true
    depth: 5
    kernel_size: 8
    stride: 4
    normalize: true
    resample: 4
    growth: 2
    rescale: 0.1
